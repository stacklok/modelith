version: 2
project_name: modelith

builds:
  - id: modelith
    main: ./cmd/modelith
    binary: modelith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: modelith
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: modelith
    binaries: [modelith]
    homepage: "https://github.com/stacklok/modelith"
    description: "Tooling for authoring, validating, and rendering domain models"
    commit_author:
      name: stacklokbot
      email: info@stacklok.com
    repository:
      owner: stacklok
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Homebrew quarantines cask downloads, and the darwin binaries are not
    # notarized, so Gatekeeper would refuse to run them. This strips the
    # quarantine attribute after install.
    #
    # Written as a raw postflight_steps stanza because the hooks.post.install
    # option writes the Ruby postflight block Homebrew has deprecated, and
    # GoReleaser's install_steps replacement is not in a stable release yet.
    # The body matches what install_steps generates. {{staged_path}} is a
    # Homebrew token, escaped so GoReleaser's own templating passes it through.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/modelith"]
        end
      end

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    output: true
    signature: "${artifact}.sigstore.json"

changelog:
  use: github
  sort: asc

release:
  prerelease: auto

# The GoReleaser binary version is pinned in the release workflow
# (goreleaser-action `version:`), not floated, so releases are reproducible.
