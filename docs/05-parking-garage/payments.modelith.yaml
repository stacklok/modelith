# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
kind: DomainModel
version: v1
title: Payments
shared: true
description: >-
  How money is taken and given back. A deliberately small context that owns the
  vocabulary of settling a charge — nothing in it knows what was bought, which
  is why the parking-garage model can reference its `PaymentMethod` instead of
  keeping a second copy of the same list.

glossary:
  Payer: >-
    Whoever hands over the money for a `Payment` — a person at a terminal, or a
    standing arrangement charged automatically. A role, not modeled as an
    entity.
  Merchant: >-
    Whoever took the money and can give it back. Issues a `Refund`; a role, not
    modeled as an entity.

enums:
  PaymentMethod:
    description: How a `Payment` was tendered.
    values:
      - name: card
        definition: A payment card, tapped or inserted at a terminal.
      - name: cash
        definition: Notes or coins, accepted by a machine or by a person.
      - name: account
        definition: >-
          Charged to a standing arrangement and settled later, so the `Payer` is
          billed rather than paying at the moment of the `Payment`.

entities:
  Payment:
    definition: >-
      One completed transfer of money for one charge: an amount, the method it
      was tendered with, and the moment it succeeded. A `Payment` records a
      transfer that settled — a declined card produces no `Payment` — and its
      amount never changes afterwards; money given back is a `Refund`.
    relationships:
      - entity: Refund
        cardinality: 1:n
        ownership: owned
        note: >-
          Money returned from this `Payment`. There may be several partial ones,
          and none at all is the ordinary case.
    attributes:
      - name: amount
        type: integer
        description: What was taken, in the smallest currency unit.
      - name: method
        type: PaymentMethod
      - name: settledAt
        type: timestamp
        description: When the transfer succeeded.
      - name: refundedTotal
        type: integer
        derived: true
        derivation: The sum of the amounts of this `Payment`'s `Refund`s.
    actions:
      - name: take
        actor: Payer
        preserves: [payment-amount-positive]
        description: Tender the amount and, on success, record the `Payment`.
    invariants:
      - id: payment-amount-positive
        statement: A `Payment`'s amount is greater than zero.
      - id: payment-method-fixed
        statement: >-
          A `Payment`'s method is fixed once it has settled; paying a different
          way is a new `Payment`.

  Refund:
    definition: >-
      Money returned from one `Payment`, in whole or in part. A `Refund` belongs
      to exactly one `Payment` and is always given back by the method that
      `Payment` used, so it carries no method of its own.
    attributes:
      - name: amount
        type: integer
        description: What was returned, in the smallest currency unit.
      - name: issuedAt
        type: timestamp
    actions:
      - name: issue
        actor: Merchant
        preserves: [refund-within-payment, refund-after-settlement]
    invariants:
      - id: refund-within-payment
        statement: >-
          The amounts of a `Payment`'s `Refund`s never total more than that
          `Payment`'s amount.
      - id: refund-after-settlement
        statement: A `Refund` is issued at or after its `Payment` settled.

scenarios:
  - name: A charge is settled by card
    actors: [Payer, Payment]
    steps:
      - A `Payer` is asked for an amount and taps a card at the terminal.
      - >-
        The card is accepted, so a `Payment` records the amount, the method
        `card`, and the moment it settled.
      - >-
        Asked later to pay the same charge by cash instead, the system declines:
        the settled `Payment`'s method does not change.
    invariants_touched:
      - payment-amount-positive
      - payment-method-fixed

  - name: Part of a charge is given back
    actors: [Merchant, Payment, Refund]
    steps:
      - A settled `Payment` of 500 exists, with nothing returned from it yet.
      - >-
        The `Merchant` issues a `Refund` of 200 against it; the `Payment`'s
        refunded total becomes 200.
      - >-
        A second `Refund` of 400 is attempted; the system refuses it, because
        the two together would exceed the `Payment`.
    invariants_touched:
      - refund-within-payment
      - refund-after-settlement
